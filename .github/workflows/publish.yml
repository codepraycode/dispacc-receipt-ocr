name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          # Removed registry-url from here to fix the npm install 403 error

      # Upgraded to npm ci for faster, predictable, and clean CI installations
      - run: npm ci

      - run: npm run build --if-present

      # Pass the registry directly to the publish command instead
      - name: Publish
        run: npm publish --access public --provenance --registry=https://npmjs.org
