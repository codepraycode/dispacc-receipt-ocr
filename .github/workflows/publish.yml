name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Vital: This requests the secure login token from GitHub
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - name: Publish
        run: pnpm publish --no-git-checks --access public --provenance
        env:
          # Explicitly instructs the publishing agent to use GitHub's identity provider
          NPM_CONFIG_PROVENANCE_GHA_PLAYER: true
