name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for GitHub OIDC token generation
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      # Explicitly build your TypeScript output using pnpm 
      - run: pnpm run build

      # Use the native npm CLI to execute the actual OIDC trusted publication.
      # This completely bypasses the pnpm auth imitation bug.
      - name: Publish to npm via OIDC
        run: npm publish --access public --provenance
