name: Publish to npm

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      # Fixed: Removed the forced version 9 constraint to let it read your package.json version
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # Modified: Setting this env suppresses the Node 20 runner deprecation logs cleanly
      - run: pnpm install --frozen-lockfile
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

      - run: pnpm run build

      - name: Publish
        run: pnpm publish --no-git-checks --access public --provenance
